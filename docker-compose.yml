services:
  db:
    image: postgres:17
    container_name: studylog-db
    environment:
      POSTGRES_DB: studylog
      POSTGRES_USER: studylog
      POSTGRES_PASSWORD: studylog
    ports:
      - "5432:5432"
    volumes:
      - studylog_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: studylog-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  studylog_pgdata: