spring.application.name=studylog

spring.datasource.url=jdbc:postgresql://localhost:5432/studylog
spring.datasource.username=studylog
spring.datasource.password=studylog

spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=studylog-dev-secret-key-must-be-at-least-32-characters-long
app.jwt.expiration-ms=86400000

app.reset-password.expiration-minutes=60
app.reset-password.base-url=http://localhost:5173/reset-password
app.auth.expose-reset-link=true

# Email (Mailpit for local dev: docker compose up -d mailpit, inbox at http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.enabled=true
app.mail.from=studylog@localhost